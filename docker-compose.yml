services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: nwis-db
    environment:
      POSTGRES_DB: nwis
      POSTGRES_USER: nwis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nwis -d nwis"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: nwis-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    container_name: nwis-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nwis:${POSTGRES_PASSWORD:-password}@db:5432/nwis
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: ./packages/worker
      dockerfile: Dockerfile
    container_name: nwis-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nwis:${POSTGRES_PASSWORD:-password}@db:5432/nwis
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: nwis-frontend
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pg_data:
  minio_data:
